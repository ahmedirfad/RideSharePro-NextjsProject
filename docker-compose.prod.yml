services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: ridesharepro-server

    restart: unless-stopped

    ports:
      - "5002:5002"

    env_file:
      - ./server/.env

    environment:
      NODE_ENV: production
      PORT: 5002

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"